      <stop offset="60%" stop-color="#b5651d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f4f0e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
